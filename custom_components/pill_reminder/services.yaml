mark_taken:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: pill_reminder
    taken_at:
      required: false
      selector:
        datetime:

snooze:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: pill_reminder
    minutes:
      required: false
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: box

skip:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: pill_reminder

get_history:
  fields: &history_fields
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: pill_reminder
    entity_id:
      required: false
      selector:
        entity:
          integration: pill_reminder
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    status:
      required: false
      selector:
        select:
          multiple: true
          translation_key: status
          options:
            - taken
            - missed
            - skipped
            - paused
            - due
            - snoozed

export_history:
  fields: *history_fields

add_measurement:
  fields:
    config_entry_id: &person
      required: false
      selector:
        config_entry:
          integration: pill_reminder
    entity_id: &person_entity
      required: false
      selector:
        entity:
          integration: pill_reminder
    metric: &metric
      required: false
      selector:
        select:
          translation_key: metric
          options:
            - weight
            - waist
            - blood_pressure
    value:
      required: false
      selector:
        number:
          min: 20
          max: 400
          step: 0.1
          mode: box
    systolic:
      required: false
      selector:
        number:
          min: 60
          max: 260
          unit_of_measurement: mmHg
          mode: box
    diastolic:
      required: false
      selector:
        number:
          min: 30
          max: 160
          unit_of_measurement: mmHg
          mode: box
    pulse:
      required: false
      selector:
        number:
          min: 30
          max: 220
          unit_of_measurement: bpm
          mode: box
    measured_at:
      required: false
      selector:
        datetime:

delete_measurement:
  fields:
    config_entry_id: *person
    entity_id: *person_entity
    metric: *metric
    date:
      required: false
      selector:
        date:

get_measurements:
  fields: &measurement_fields
    config_entry_id: *person
    entity_id: *person_entity
    metric: *metric
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:

export_measurements:
  fields: *measurement_fields
