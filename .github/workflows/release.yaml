name: Release

on:
  release:
    types: [published]

jobs:
  version:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare release tag with manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/pill_reminder/manifest.json)"
          echo "tag=$tag manifest=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag v$tag does not match manifest version $version"
            exit 1
          fi
