# Pill Reminder - optional extra cards (needs HACS frontend cards)
#   - Mushroom          https://github.com/piitaya/lovelace-mushroom
#   - ApexCharts Card   https://github.com/RomRider/apexcharts-card
#
# These sections can be pasted under "sections:" of a view in your own
# dashboard (see pill_reminder.yaml). Entity ids are for a person "Anna" with
# the medication "Ramipril" (Home Assistant language: English) - replace them
# with yours. Repeat the blocks marked "per medication" for each medication.

- type: grid
  cards:
    - type: heading
      heading: At a glance
      icon: mdi:pill
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: entity
          entity: sensor.anna_open_today
          icon: mdi:pill-multiple
        - type: entity
          entity: sensor.anna_adherence_7_days
          icon: mdi:chart-arc
        - type: entity
          entity: sensor.anna_streak
          icon: mdi:fire
          icon_color: orange
    # --- per medication ---
    - type: custom:mushroom-template-card
      entity: sensor.ramipril_status
      primary: Ramipril {{ state_attr('sensor.ramipril_status', 'dosage') }}
      secondary: >-
        {% set n = states('sensor.ramipril_next_dose') %}
        {{ state_translated('sensor.ramipril_status') }}
        {%- if n not in ['unknown', 'unavailable'] %} · next {{ as_timestamp(n) | timestamp_custom('%a %H:%M') }}{% endif %}
      icon: mdi:pill
      icon_color: >-
        {{ {'taken':'green','due':'red','snoozed':'amber','missed':'red',
            'skipped':'grey','paused':'grey'}.get(states('sensor.ramipril_status'), 'blue') }}
      badge_icon: >-
        {{ 'mdi:bell-ring' if is_state('binary_sensor.ramipril_due', 'on') else '' }}
      badge_color: red
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_taken
        confirmation:
          text: Mark Ramipril as taken?
      hold_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_snooze

- type: grid
  column_span: 2
  cards:
    - type: heading
      heading: Adherence per day
      icon: mdi:chart-bar
    - type: custom:apexcharts-card
      graph_span: 30d
      span:
        end: day
      header:
        show: false
      yaxis:
        - min: 0
          max: 100
          decimals: 0
      apex_config:
        chart:
          height: 260
      series:
        - entity: sensor.anna_adherence_7_days
          name: Total (7-day mean)
          type: column
          color: "#2e7d32"
          statistics:
            type: mean
            period: day
        # --- per medication ---
        - entity: sensor.ramipril_adherence_7_days
          name: Ramipril
          type: line
          stroke_width: 2
          statistics:
            type: mean
            period: day
      grid_options:
        columns: full
