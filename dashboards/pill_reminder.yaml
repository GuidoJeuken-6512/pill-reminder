# Pill Reminder - example dashboard
#
# You do NOT need this file: the integration creates the dashboard
# "Health" (/pill-reminder) automatically and keeps it up to date.
#
# Use it as a starting point for your own dashboard. It shows what the
# generated dashboard looks like for a person "Anna" with the medication
# "Ramipril" who also tracks weight and waist (Home Assistant language:
# English). Replace the entity ids with yours and add
# `visible: [{user: <user id>}]` to restrict a view.

title: Health
views:
- title: Anna
  path: anna
  icon: mdi:pill
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.anna_open_today
    show_name: true
  - type: entity
    entity: sensor.anna_taken_today
    show_name: true
  - type: entity
    entity: sensor.anna_missed_today
    show_name: true
  - type: entity
    entity: sensor.anna_adherence_7_days
    show_name: true
  sections:
  - type: grid
    visibility:
    - condition: state
      entity: binary_sensor.anna_medication_due
      state: 'on'
    cards:
    - type: heading
      heading: Take now
      icon: mdi:bell-ring
    - type: tile
      entity: button.ramipril_taken
      name: Ramipril 5 mg taken
      icon: mdi:check-circle
      color: green
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_taken
      grid_options:
        columns: 8
      visibility:
      - condition: state
        entity: binary_sensor.ramipril_due
        state: 'on'
    - type: tile
      entity: button.ramipril_snooze
      name: Later
      icon: mdi:alarm-snooze
      color: amber
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_snooze
      grid_options:
        columns: 4
      visibility:
      - condition: state
        entity: binary_sensor.ramipril_due
        state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Today
      icon: mdi:calendar-today
    - type: markdown
      content: ✅ Nothing is due right now.
      visibility:
      - condition: state
        entity: binary_sensor.anna_medication_due
        state: 'off'
    - type: tile
      entity: sensor.ramipril_status
      name: Ramipril 5 mg
      icon: mdi:pill
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.ramipril_next_dose
      name: Next
      grid_options:
        columns: 6
    - type: tile
      entity: button.ramipril_taken
      name: Taken
      color: green
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_taken
        confirmation:
          text: Mark Ramipril as taken?
      grid_options:
        columns: 4
    - type: tile
      entity: button.ramipril_skip
      name: Skip
      color: grey
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ramipril_skip
        confirmation:
          text: Skip Ramipril on purpose?
      grid_options:
        columns: 4
    - type: tile
      entity: switch.ramipril_reminders
      name: Remind
      grid_options:
        columns: 4
  - type: grid
    cards:
    - type: heading
      heading: Summary
      icon: mdi:chart-arc
    - type: tile
      entity: sensor.anna_taken_today
      color: green
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_missed_today
      color: red
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_skipped_today
      color: grey
      grid_options:
        columns: 4
    - type: markdown
      content: No adherence data yet – it appears after the first dose.
      visibility:
      - condition: state
        entity: sensor.anna_adherence_7_days
        state:
        - unknown
        - unavailable
    - type: gauge
      entity: sensor.anna_adherence_7_days
      name: 7 days
      min: 0
      max: 100
      needle: true
      severity:
        green: 90
        yellow: 70
        red: 0
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_adherence_7_days
        above: -1
    - type: gauge
      entity: sensor.anna_adherence_30_days
      name: 30 days
      min: 0
      max: 100
      needle: true
      severity:
        green: 90
        yellow: 70
        red: 0
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_adherence_30_days
        above: -1
    - type: entities
      title: Per medication
      entities:
      - entity: sensor.ramipril_adherence_7_days
        name: Ramipril · 7 days
      - entity: sensor.ramipril_adherence_30_days
        name: Ramipril · 30 days
      - entity: sensor.ramipril_streak
      - entity: sensor.ramipril_last_taken
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: statistics-graph
      title: Adherence (daily mean, 30 days)
      chart_type: line
      period: day
      days_to_show: 30
      stat_types:
      - mean
      entities:
      - entity: sensor.anna_adherence_7_days
        name: Total
      - entity: sensor.ramipril_adherence_7_days
      grid_options:
        columns: full
      visibility:
      - condition: numeric_state
        entity: sensor.anna_adherence_7_days
        above: -1
    - type: history-graph
      title: Status (7 days)
      hours_to_show: 168
      entities: &id001
      - sensor.ramipril_status
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Calendar
      icon: mdi:calendar-check
    - type: calendar
      initial_view: listWeek
      entities:
      - calendar.anna_medication
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Log
      icon: mdi:format-list-bulleted
    - type: logbook
      hours_to_show: 168
      target:
        entity_id: *id001
      grid_options:
        columns: full
- title: Body
  path: anna-body
  icon: mdi:heart-pulse
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.anna_weight
    show_name: true
  - type: entity
    entity: sensor.anna_waist
    show_name: true
  - type: entity
    entity: sensor.anna_bmi
    show_name: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Enter today
      icon: mdi:pencil-plus
    - type: markdown
      content: ⏰ Today's **Weight** is still missing.
      visibility:
      - condition: state
        entity: binary_sensor.anna_weight_due
        state: 'on'
    - type: markdown
      content: ⏰ Today's **Waist circumference** is still missing.
      visibility:
      - condition: state
        entity: binary_sensor.anna_waist_due
        state: 'on'
    - type: entities
      entities:
      - entity: number.anna_weight_enter
        icon: mdi:scale-bathroom
      - entity: number.anna_waist_enter
        icon: mdi:tape-measure
    - type: markdown
      content: Type today's value and confirm with Enter.
  - type: grid
    cards:
    - type: heading
      heading: Weight
      icon: mdi:scale-bathroom
    - type: tile
      entity: sensor.anna_weight
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.anna_weight_measured
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.anna_weight_change_7_days
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_weight_change_30_days
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_weight_trend_direction
      grid_options:
        columns: 4
  - type: grid
    cards:
    - type: heading
      heading: Waist circumference
      icon: mdi:tape-measure
    - type: tile
      entity: sensor.anna_waist
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.anna_waist_measured
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.anna_waist_change_7_days
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_waist_change_30_days
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.anna_waist_trend_direction
      grid_options:
        columns: 4
  - type: grid
    cards:
    - type: heading
      heading: BMI & waist-to-height
      icon: mdi:human
    - type: markdown
      content: The BMI appears after the first weight and needs the height (Manage tab).
      visibility:
      - condition: state
        entity: sensor.anna_bmi
        state:
        - unknown
        - unavailable
    - type: gauge
      entity: sensor.anna_bmi
      name: BMI
      min: 15
      max: 40
      needle: true
      segments:
      - from: 0
        color: '#039be5'
        label: Underweight
      - from: 18.5
        color: '#43a047'
        label: Normal
      - from: 25
        color: '#ffa600'
        label: Overweight
      - from: 30
        color: '#db4437'
        label: Obese
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_bmi
        above: 0
    - type: tile
      entity: sensor.anna_bmi_category
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_bmi
        above: 0
    - type: markdown
      content: The waist-to-height ratio appears after the first waist value and needs the height (Manage
        tab).
      visibility:
      - condition: state
        entity: sensor.anna_waist_to_height_ratio
        state:
        - unknown
        - unavailable
    - type: gauge
      entity: sensor.anna_waist_to_height_ratio
      name: Waist-to-height ratio
      min: 0.3
      max: 0.8
      needle: true
      segments:
      - from: 0
        color: '#43a047'
        label: Healthy
      - from: 0.5
        color: '#ffa600'
        label: Increased
      - from: 0.6
        color: '#db4437'
        label: High
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_waist_to_height_ratio
        above: 0
    - type: tile
      entity: sensor.anna_waist_to_height_category
      grid_options:
        columns: 6
      visibility:
      - condition: numeric_state
        entity: sensor.anna_waist_to_height_ratio
        above: 0
    - type: markdown
      content: <small>BMI and WHtR are reference values for adults, not a diagnosis. Not a medical device.</small>
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: History (90 days)
      icon: mdi:chart-line
    - type: markdown
      content: 'Weight: The history appears after the first value.'
      visibility:
      - condition: state
        entity: sensor.anna_weight
        state:
        - unknown
        - unavailable
    - type: statistics-graph
      title: Weight
      chart_type: line
      period: day
      days_to_show: 90
      stat_types:
      - mean
      - min
      - max
      entities:
      - sensor.anna_weight
      grid_options:
        columns: full
      visibility:
      - condition: numeric_state
        entity: sensor.anna_weight
        above: 0
    - type: markdown
      content: 'Waist circumference: The history appears after the first value.'
      visibility:
      - condition: state
        entity: sensor.anna_waist
        state:
        - unknown
        - unavailable
    - type: statistics-graph
      title: Waist circumference
      chart_type: line
      period: day
      days_to_show: 90
      stat_types:
      - mean
      - min
      - max
      entities:
      - sensor.anna_waist
      grid_options:
        columns: full
      visibility:
      - condition: numeric_state
        entity: sensor.anna_waist
        above: 0
- title: Manage
  path: anna-manage
  icon: mdi:cog
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Manage medication
      icon: mdi:cog
    - type: markdown
      content: 'Changes apply immediately. Times: `08:00, 20:00` · Weekdays: `daily`, `Mon-Fri` or `Mon,
        Wed, Fri`.'
    - type: entities
      title: Ramipril
      state_color: true
      entities:
      - text.ramipril_name
      - text.ramipril_intake_times
      - text.ramipril_weekdays
      - text.ramipril_dosage
      - number.ramipril_confirm_early_minutes_before
      - number.ramipril_missed_after_minutes
      - switch.ramipril_reminders
      - type: button
        name: Delete
        icon: mdi:delete
        action_name: Delete
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ramipril_delete_medication
          confirmation:
            text: Really delete Ramipril? Its history is kept.
      grid_options:
        columns: 6
    - type: entities
      title: New medication
      entities:
      - text.anna_new_medication_name
      - text.anna_new_medication_times
      - text.anna_new_medication_dosage
      - type: button
        name: New medication
        icon: mdi:plus-circle
        action_name: Add
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.anna_add_medication
          confirmation:
            text: Create a medication with these values?
      grid_options:
        columns: 6
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Measurements
      icon: mdi:heart-pulse
    - type: markdown
      content: 'Reminder per measurement: time and weekdays, e.g. `daily`, `Mon` or `Mon-Fri`. The height
        is needed for BMI and waist-to-height ratio.'
    - type: entities
      title: Person
      entities:
      - number.anna_height
      grid_options:
        columns: 6
    - type: entities
      title: Weight
      state_color: true
      entities:
      - switch.anna_weight_reminder
      - time.anna_weight_reminder_time
      - text.anna_weight_reminder_weekdays
      grid_options:
        columns: 6
    - type: entities
      title: Waist circumference
      state_color: true
      entities:
      - switch.anna_waist_reminder
      - time.anna_waist_reminder_time
      - text.anna_waist_reminder_weekdays
      grid_options:
        columns: 6
    - type: markdown
      content: 'Add or remove a measurement: **Settings → Devices & services → Pill Reminder → Add measurement**'
