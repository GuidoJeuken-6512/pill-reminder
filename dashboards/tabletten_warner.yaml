# Tabletten-Warner – Dashboard (nur Standard-Karten, keine HACS-Abhängigkeiten)
#
# Einrichtung:
#   Einstellungen → Dashboards → Dashboard hinzufügen → "Neu von Grund auf"
#   → ⋮ → Rohkonfigurationseditor → diesen Inhalt einfügen.
#
# Platzhalter ersetzen (Suchen & Ersetzen):
#   anna              → Gerätename der Person, kleingeschrieben (Entity-IDs: sensor.anna_…)
#   ramipril          → Gerätename des Medikaments (für jedes weitere Medikament die
#                       markierten Blöcke "# --- je Medikament ---" kopieren)
#   ANNA_USER_ID      → Benutzer-ID (Einstellungen → Personen → Benutzer → ID)
#
# Entity-IDs entstehen aus Gerät + übersetztem Namen (HA-Sprache Deutsch):
#   button.<med>_eingenommen / _spater / _uberspringen, binary_sensor.<med>_fallig,
#   sensor.<med>_status / _nachste_einnahme / _letzte_einnahme / _einnahmetreue_7_tage /
#   _einnahmetreue_30_tage / _serie, switch.<med>_erinnerungen
#   binary_sensor.<person>_medikament_fallig, sensor.<person>_offen_heute,
#   sensor.<person>_einnahmetreue_7_tage / _30_tage / _serie, calendar.<person>_medikamente

title: Tabletten
views:
  - title: Anna
    path: anna
    icon: mdi:pill
    type: sections
    max_columns: 3
    # Nur Anna (und Admins, die man hier zusätzlich eintragen kann) sehen diese Ansicht
    visible:
      - user: ANNA_USER_ID
    badges:
      - type: entity
        entity: sensor.anna_offen_heute
        name: Offen heute
        show_name: true
      - type: entity
        entity: sensor.anna_einnahmetreue_7_tage
        name: 7 Tage
        show_name: true
      - type: entity
        entity: sensor.anna_serie
        name: Serie
        show_name: true
    sections:
      # ------------------------------------------------------------------
      # 1) Jetzt einnehmen – nur sichtbar, wenn fällig UND der richtige
      #    Benutzer angemeldet ist (userabhängige Frontend-Benachrichtigung)
      # ------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Jetzt einnehmen
            icon: mdi:bell-ring
            visibility:
              - condition: state
                entity: binary_sensor.anna_medikament_fallig
                state: "on"
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.anna_medikament_fallig
                state: "on"
              - condition: user
                users:
                  - ANNA_USER_ID
            content: >-
              ## 💊 Zeit für deine Tabletten

              {% for m in state_attr('binary_sensor.anna_medikament_fallig', 'medications') or [] -%}
              - **{{ m }}**
              {% endfor %}
          # --- je Medikament (Start) ---
          - type: tile
            entity: button.ramipril_eingenommen
            name: Ramipril eingenommen
            icon: mdi:check-circle
            color: green
            vertical: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.ramipril_eingenommen
            grid_options:
              columns: 8
            visibility:
              - condition: state
                entity: binary_sensor.ramipril_fallig
                state: "on"
              - condition: user
                users:
                  - ANNA_USER_ID
          - type: tile
            entity: button.ramipril_spater
            name: Später
            icon: mdi:alarm-snooze
            color: amber
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.ramipril_spater
            grid_options:
              columns: 4
            visibility:
              - condition: state
                entity: binary_sensor.ramipril_fallig
                state: "on"
              - condition: user
                users:
                  - ANNA_USER_ID
          # --- je Medikament (Ende) ---
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.anna_medikament_fallig
                state: "off"
            content: ✅ Gerade ist nichts fällig.

      # ------------------------------------------------------------------
      # 2) Heute
      # ------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today
          # --- je Medikament (Start) ---
          - type: tile
            entity: sensor.ramipril_status
            name: Ramipril
            state_content:
              - state
              - dosage
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ramipril_nachste_einnahme
            name: Nächste
            state_content: state
            grid_options:
              columns: 6
          - type: tile
            entity: button.ramipril_eingenommen
            name: Eingenommen
            icon: mdi:check-circle
            color: green
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.ramipril_eingenommen
              confirmation:
                text: Ramipril als eingenommen markieren?
            grid_options:
              columns: 4
          - type: tile
            entity: button.ramipril_uberspringen
            name: Auslassen
            icon: mdi:skip-next-circle
            color: grey
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.ramipril_uberspringen
              confirmation:
                text: Ramipril bewusst auslassen?
            grid_options:
              columns: 4
          - type: tile
            entity: switch.ramipril_erinnerungen
            name: Erinnern
            grid_options:
              columns: 4
          # --- je Medikament (Ende) ---

      # ------------------------------------------------------------------
      # 3) Einnahmetreue
      # ------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Einnahmetreue
            icon: mdi:chart-arc
          - type: gauge
            entity: sensor.anna_einnahmetreue_7_tage
            name: 7 Tage
            min: 0
            max: 100
            needle: true
            severity:
              green: 90
              yellow: 70
              red: 0
            grid_options:
              columns: 6
          - type: gauge
            entity: sensor.anna_einnahmetreue_30_tage
            name: 30 Tage
            min: 0
            max: 100
            needle: true
            severity:
              green: 90
              yellow: 70
              red: 0
            grid_options:
              columns: 6
          - type: entities
            title: Pro Medikament
            entities:
              # --- je Medikament ---
              - entity: sensor.ramipril_einnahmetreue_7_tage
                name: Ramipril 7 Tage
              - entity: sensor.ramipril_einnahmetreue_30_tage
                name: Ramipril 30 Tage
              - entity: sensor.ramipril_serie
                name: Ramipril Serie
              - entity: sensor.ramipril_letzte_einnahme
                name: Ramipril zuletzt
                format: relative

      # ------------------------------------------------------------------
      # 4) Verlauf (Langzeitstatistik + Status-Historie)
      # ------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            icon: mdi:chart-line
          - type: statistics-graph
            title: Einnahmetreue (Tagesmittel, 30 Tage)
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - entity: sensor.anna_einnahmetreue_7_tage
                name: Gesamt 7 Tage
              # --- je Medikament ---
              - entity: sensor.ramipril_einnahmetreue_7_tage
                name: Ramipril 7 Tage
            grid_options:
              columns: full
          - type: history-graph
            title: Status (7 Tage)
            hours_to_show: 168
            entities:
              # --- je Medikament ---
              - entity: sensor.ramipril_status
                name: Ramipril
            grid_options:
              columns: full

      # ------------------------------------------------------------------
      # 5) Kalender (eingenommen ✅ / verpasst ❌ / übersprungen ⏭️ / geplant 🕒)
      # ------------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Kalender
            icon: mdi:calendar-check
          - type: calendar
            initial_view: dayGridMonth
            entities:
              - calendar.anna_medikamente
            grid_options:
              columns: full

      # ------------------------------------------------------------------
      # 6) Logbuch (wann wurde erinnert, eingenommen, verpasst, eskaliert)
      # ------------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Protokoll
            icon: mdi:format-list-bulleted
          - type: logbook
            hours_to_show: 168
            target:
              entity_id:
                # --- je Medikament ---
                - sensor.ramipril_status
            grid_options:
              columns: full
