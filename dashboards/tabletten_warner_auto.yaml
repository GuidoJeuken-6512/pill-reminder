# Tabletten-Warner – Dashboard, das alle Medikamente automatisch findet
#
# Benötigt die HACS-Frontend-Karte "auto-entities":
#   https://github.com/thomasloven/lovelace-auto-entities
#
# Neue Medikamente erscheinen ohne YAML-Änderung. Ersetzen musst du nur:
#   Anna          → Name der Person, genau wie in der Integration eingetragen
#                   (wird mit dem Attribut "person" der Entitäten verglichen)
#   anna          → derselbe Name kleingeschrieben (Entity-IDs der Personen-Sensoren)
#   ANNA_USER_ID  → Benutzer-ID (Einstellungen → Personen → Benutzer → ID)
# Für weitere Personen die View kopieren.
#
# Einrichtung: Einstellungen → Dashboards → Dashboard hinzufügen → "Neu von Grund auf"
#   → ⋮ → Rohkonfigurationseditor → diesen Inhalt einfügen.
# Ohne HACS: dashboards/tabletten_warner.yaml (nur Standard-Karten) verwenden.

title: Tabletten
views:
  - title: Anna
    path: anna
    icon: mdi:pill
    type: sections
    max_columns: 3
    visible:
      - user: ANNA_USER_ID
    badges:
      - type: entity
        entity: sensor.anna_offen_heute
        show_name: true
      - type: entity
        entity: sensor.anna_heute_eingenommen
        show_name: true
      - type: entity
        entity: sensor.anna_heute_verpasst
        show_name: true
      - type: entity
        entity: sensor.anna_einnahmetreue_7_tage
        show_name: true
    sections:
      # ------------------------------------------------------------------
      # 1) Jetzt einnehmen – nur für Anna sichtbar und nur, wenn etwas fällig ist.
      #    Zeigt für jedes fällige Medikament einen großen "Eingenommen"-Button.
      # ------------------------------------------------------------------
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.anna_medikament_fallig
            state: "on"
          - condition: user
            users:
              - ANNA_USER_ID
        cards:
          - type: heading
            heading: Jetzt einnehmen
            icon: mdi:bell-ring
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - integration: tabletten_warner
                  domain: button
                  attributes:
                    person: Anna
                    due: true
                  options:
                    type: tile
                    color: green
                    icon: mdi:check-circle
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: this.entity_id
            sort:
              method: attribute
              attribute: scheduled

      # ------------------------------------------------------------------
      # 2) Heute – Status jedes Medikaments + Button, sobald bestätigt werden darf
      # ------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today
          - type: custom:auto-entities
            show_empty: true
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - integration: tabletten_warner
                  domain: sensor
                  attributes:
                    person: Anna
                    device_class: enum
                  options:
                    type: tile
                    state_content:
                      - state
                      - dosage
            sort:
              method: attribute
              attribute: medication
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - integration: tabletten_warner
                  domain: button
                  attributes:
                    person: Anna
                    actionable: true
                  options:
                    type: tile
                    color: green
                    hide_state: true
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: this.entity_id
                      confirmation:
                        text: Als eingenommen markieren?

      # ------------------------------------------------------------------
      # 3) Tagesbilanz und Einnahmetreue
      # ------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Bilanz
            icon: mdi:chart-arc
          - type: tile
            entity: sensor.anna_heute_eingenommen
            color: green
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.anna_heute_verpasst
            color: red
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.anna_heute_ubersprungen
            color: grey
            grid_options:
              columns: 4
          - type: gauge
            entity: sensor.anna_einnahmetreue_7_tage
            name: 7 Tage
            min: 0
            max: 100
            needle: true
            severity:
              green: 90
              yellow: 70
              red: 0
            grid_options:
              columns: 6
          - type: gauge
            entity: sensor.anna_einnahmetreue_30_tage
            name: 30 Tage
            min: 0
            max: 100
            needle: true
            severity:
              green: 90
              yellow: 70
              red: 0
            grid_options:
              columns: 6
          - type: custom:auto-entities
            card:
              type: entities
              title: Pro Medikament (7 Tage)
            filter:
              include:
                - integration: tabletten_warner
                  domain: sensor
                  entity_id: "*7*"
                  attributes:
                    person: Anna
                    unit_of_measurement: "%"
            sort:
              method: state
              numeric: true

      # ------------------------------------------------------------------
      # 4) Verlauf
      # ------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            icon: mdi:chart-line
          - type: custom:auto-entities
            card:
              type: statistics-graph
              title: Einnahmetreue (Tagesmittel, 30 Tage)
              chart_type: line
              period: day
              days_to_show: 30
              stat_types:
                - mean
            filter:
              include:
                - entity_id: sensor.anna_einnahmetreue_7_tage
                - integration: tabletten_warner
                  domain: sensor
                  entity_id: "*7*"
                  attributes:
                    person: Anna
                    unit_of_measurement: "%"
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: history-graph
              title: Status (7 Tage)
              hours_to_show: 168
            filter:
              include:
                - integration: tabletten_warner
                  domain: sensor
                  attributes:
                    person: Anna
                    device_class: enum
            grid_options:
              columns: full

      # ------------------------------------------------------------------
      # 5) Kalender (Beschreibung je Termin: Dosis, Einnahmezeit, Verspätung,
      #    Erinnerungen, Quelle)
      # ------------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Kalender
            icon: mdi:calendar-check
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.anna_medikamente
            grid_options:
              columns: full

      # ------------------------------------------------------------------
      # 6) Protokoll – alle Ereignisse der Medikamente von Anna
      # ------------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Protokoll
            icon: mdi:format-list-bulleted
          - type: custom:auto-entities
            card:
              type: logbook
              hours_to_show: 168
            filter:
              include:
                - integration: tabletten_warner
                  domain: sensor
                  attributes:
                    person: Anna
                    device_class: enum
            grid_options:
              columns: full
